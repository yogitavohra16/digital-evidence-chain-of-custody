{% load forensic_tags %}
{% if page.paginator.num_pages > 1 %}
<nav class="d-flex justify-content-between align-items-center p-3 border-top" aria-label="Pagination">
  <span class="text-muted small">Page {{ page.number }} of {{ page.paginator.num_pages }} ({{ page.paginator.count }} total)</span>
  <ul class="pagination pagination-sm mb-0">
    {% if page.has_previous %}<li class="page-item"><a class="page-link" href="{% page_url page.previous_page_number %}">Previous</a></li>{% endif %}
    {% if page.has_next %}<li class="page-item"><a class="page-link" href="{% page_url page.next_page_number %}">Next</a></li>{% endif %}
  </ul>
</nav>
{% endif %}
